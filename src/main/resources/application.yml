spring:
  application:
    name: user-management-service

  profiles:
    active: ${APP_ENV:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_mgmt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: UserMgmtPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages the schema; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

# JWT settings — override in environment variables in production
app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tYW5kLXVzZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:900000}        # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}   # 7 days
    issuer: ${JWT_ISSUER:user-management-service}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.example.usermanagement: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
