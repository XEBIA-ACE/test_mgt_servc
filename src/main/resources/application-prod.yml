spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:25}
      minimum-idle: 5

  jpa:
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

logging:
  level:
    root: WARN
    com.example.usermanagement: INFO
  file:
    name: /var/log/user-management/application.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false   # Disable Swagger UI in production
  api-docs:
    enabled: false
