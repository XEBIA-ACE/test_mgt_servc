spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Enable prepared statement caching for improved throughput
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: WARN
    com.example.usermanagement: INFO
    org.springframework.security: WARN

# In production, JWT secret and DB credentials MUST come from a secrets manager
# (e.g. AWS Secrets Manager, HashiCorp Vault) injected as environment variables.
