spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_mgmt_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate    # Flyway manages DDL; Hibernate only validates

app:
  jwt:
    # DEV-ONLY secret — MUST be replaced in staging/production with a 512-bit random key
    # Generate: openssl rand -base64 64
    secret: ${APP_JWT_SECRET:dGhpcmlzYS1kZXYtb25seS1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHM1MTItZG9udC11c2UtaW4tcHJvZA==}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.usermanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
