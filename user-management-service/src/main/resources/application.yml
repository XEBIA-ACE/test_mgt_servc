spring:
  application:
    name: user-management-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  # Compress responses larger than 1 KB
  compression:
    enabled: true
    min-response-size: 1024

# Actuator — health and metrics endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

# Build info for /actuator/info
info:
  app:
    name: ${spring.application.name}
    description: User Management Service with JWT and role-based access control
    version: '@project.version@'

# Structured logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.usermanagement: DEBUG
    org.springframework.security: INFO
    # Enable SQL logging in dev only (overridden per profile)
    org.hibernate.SQL: OFF
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
