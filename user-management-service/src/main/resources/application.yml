spring:
  application:
    name: user-management-service

  # Profile-specific overrides are in application-{profile}.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # JPA / Hibernate
  jpa:
    open-in-view: false           # Prevent lazy-loading issues via open session in view
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway — auto-runs migrations on startup
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

# JWT configuration
app:
  jwt:
    # Base64-encoded HMAC-SHA512 secret (512-bit minimum). Override via APP_JWT_SECRET env var.
    secret: ${APP_JWT_SECRET}
    # Access token lifetime: 15 minutes
    access-token-expiration-ms: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    # Refresh token lifetime: 30 days
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_MS:2592000000}
  token:
    # How often to run the expired-token cleanup job
    cleanup-interval-ms: ${APP_TOKEN_CLEANUP_INTERVAL_MS:3600000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    description: User Management Service

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.usermanagement: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
