spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  # Flyway disabled — schema created by Hibernate ddl-auto
  flyway:
    enabled: false

app:
  jwt:
    # Safe test-only secret — 64 Base64 chars = 48 bytes > 256 bits minimum
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RpbmctcHVycG9zZXMtb25seS0tLQ==
    access-token-expiration-ms: 900000
    refresh-token-expiration-days: 7

logging:
  level:
    root: WARN
    com.example.usermanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
