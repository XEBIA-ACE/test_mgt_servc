version: "3.9"

services:
  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: runtime
    container_name: user-mgmt-app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      DB_URL: jdbc:postgresql://postgres:5432/user_mgmt
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tYW5kLXVzZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user-mgmt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: user-mgmt-postgres
    environment:
      POSTGRES_DB: user_mgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - user-mgmt-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional dev tool) ───────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: user-mgmt-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - user-mgmt-net
    profiles:
      - tools   # only start with: docker compose --profile tools up

volumes:
  postgres_data:

networks:
  user-mgmt-net:
    driver: bridge
